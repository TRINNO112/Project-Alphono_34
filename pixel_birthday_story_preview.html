
<style>
  #bdW{display:flex;flex-direction:column;align-items:center;padding:1.5rem 0;gap:10px}
  #bdC{image-rendering:pixelated;image-rendering:-moz-crisp-edges;border-radius:8px;border:3px solid #2d1b69;cursor:pointer;display:block;max-width:100%}
  #bdD{display:none;background:#0d0d1a;border:2px solid #6d4cb5;border-radius:6px;padding:12px 18px;width:480px;max-width:100%;box-sizing:border-box;cursor:pointer}
  #bdT{color:#e8d5ff;font-family:monospace;font-size:13px;margin:0 0 6px;line-height:1.75;white-space:pre-wrap}
  #bdK{color:#6d4cb5;font-family:monospace;font-size:11px;margin:0;text-align:right}
  #bdS{font-family:monospace;background:#1a0a2e;color:#e8d5ff;border:2px solid #7c3aed;border-radius:4px;padding:10px 32px;font-size:14px;cursor:pointer;letter-spacing:0.05em}
</style>
<div id="bdW">
  <canvas id="bdC"></canvas>
  <div id="bdD" onclick="bdAdv()"><p id="bdT"></p><p id="bdK">▼ tap to continue</p></div>
  <button id="bdS" onclick="bdGo()">▶ PRESS START</button>
</div>
<script>
(function(){
  const C=document.getElementById('bdC'),ctx=C.getContext('2d');
  ctx.imageSmoothingEnabled=false;
  const SC=3,LW=160,LH=100,GY=68;
  C.width=LW*SC; C.height=LH*SC;
  C.style.width=LW*SC+'px'; C.style.height=LH*SC+'px';

  const DLGS=[
    "A mysterious envelope\nfell from the starlit sky...",
    "[ From: Someone Who Loves You ]\n\nDear Birthday Hero,",
    "You make every day brighter\njust by being you. 🌟",
    "🎆  Make a wish!\nThis story was made just for you.\n                      — with love 💜"
  ];
  const EX=98, EY=GY-9;
  let state='TITLE', fr=0, cx=12, ot=0, di=0;

  function R(x,y,w,h,c){
    if(w<=0||h<=0)return;
    ctx.fillStyle=c;
    ctx.fillRect(Math.round(x)*SC,Math.round(y)*SC,Math.round(w)*SC,Math.round(h)*SC);
  }

  function bg(){
    [['#1a0a2e',0,14],['#1f0f36',14,28],['#251644',28,42],['#2b1c52',42,56],['#302360',56,68]].forEach(([c,y1,y2])=>R(0,y1,LW,y2-y1,c));
    R(128,10,12,12,'#ffe87a'); R(129,9,10,1,'#ffe87a'); R(129,22,10,1,'#ffe87a');
    R(127,11,1,10,'#ffe87a'); R(140,11,1,10,'#ffe87a'); R(131,14,3,3,'#f0d050');
    [[15,8],[35,5],[55,18],[72,9],[90,14],[110,6],[142,20],[152,8],[28,25],[65,30],[118,28],[48,12],[138,15],[20,40],[100,38]].forEach(([sx,sy])=>R(sx,sy,1,1,'#fff'));
    R(0,GY,LW,2,'#2d5a1b'); R(0,GY+2,LW,LH-GY-2,'#1a3a0f');
    for(let gx=3;gx<LW;gx+=7) R(gx,GY,2,1,'#3d7a27');
  }

  function char(px,py,f,act){
    const lx=Math.round(px)-5;
    if(act==='reach'){
      R(lx+1,py-8,8,5,'#2a5298'); R(lx+1,py-8,8,1,'#3b6bc4');
      R(lx,py-6,1,3,'#1d3f80'); R(lx+9,py-6,2,2,'#ffd5b4'); R(lx+10,py-4,2,3,'#ffd5b4');
      R(lx+2,py-3,3,3,'#1a3a5c'); R(lx+5,py-3,3,3,'#1a3a5c');
      R(lx+2,py,4,2,'#111'); R(lx+5,py,4,2,'#111');
      R(lx+2,py-16,7,7,'#ffd5b4'); R(lx+2,py-19,7,3,'#3d2314');
      R(lx+1,py-18,1,4,'#3d2314'); R(lx+9,py-18,1,4,'#3d2314');
      R(lx+3,py-14,2,2,'#111'); R(lx+7,py-14,1,2,'#111');
      R(lx+2,py-11,2,2,'#cc3333');
    } else {
      const lp=[[0,0],[2,-2],[0,0],[-2,2]][f%4];
      R(lx+1,py-6+lp[0],3,6-Math.abs(lp[0]),'#1a3a5c'); R(lx+1,py+lp[0],4,2,'#111');
      R(lx+6,py-6+lp[1],3,6-Math.abs(lp[1]),'#1a3a5c'); R(lx+6,py+lp[1],4,2,'#111');
      R(lx+1,py-13,8,7,'#2a5298'); R(lx+1,py-13,8,1,'#3b6bc4');
      R(lx,py-11,1,4,'#1d3f80'); R(lx+9,py-11,1,4,'#1d3f80');
      R(lx,py-8,2,2,'#ffd5b4');
      if(act==='hold') R(lx+9,py-13,1,1,'#ffd5b4'); else R(lx+8,py-8,2,2,'#ffd5b4');
      R(lx+1,py-12,8,2,'#cc3333');
      R(lx+1,py-21,8,7,'#ffd5b4'); R(lx+1,py-24,8,3,'#3d2314');
      R(lx,py-23,1,5,'#3d2314'); R(lx+9,py-23,1,5,'#3d2314');
      R(lx+2,py-19,2,2,'#111'); R(lx+6,py-19,2,2,'#111');
      R(lx+4,py-16,2,1,'#cc6666');
      R(lx+2,py-17,1,1,'#ffaaaa'); R(lx+7,py-17,1,1,'#ffaaaa');
    }
  }

  function env(ex,ey,w,h,op){
    R(ex,ey,w,h,'#f5e6c8');
    R(ex,ey,w,1,'#c8b87a'); R(ex,ey+h-1,w,1,'#c8b87a');
    R(ex,ey,1,h,'#c8b87a'); R(ex+w-1,ey,1,h,'#c8b87a');
    const mid=ex+Math.floor(w/2), fh=Math.floor(h*0.45);
    if(op<0.5){
      for(let i=0;i<fh;i++){R(ex+i,ey+i,1,1,'#d4a84b'); R(ex+w-1-i,ey+i,1,1,'#d4a84b')}
      R(mid-2,ey+fh-2,5,5,'#cc3333'); R(mid-1,ey+fh-3,3,1,'#cc3333');
      R(mid-1,ey+fh+2,3,1,'#cc3333'); R(mid,ey+fh-1,1,1,'#ff6666');
    } else {
      const bf=Math.floor(h*0.35);
      for(let i=0;i<bf;i++){R(ex+i,ey+i,1,1,'#d4a84b'); R(ex+w-1-i,ey+i,1,1,'#d4a84b')}
      const fo=(op-0.5)*2, fu=Math.round(fh*fo);
      if(fu>0) R(ex,ey-fu,w,fu,'#e8c87a');
      if(op>0.7){
        const ls=(op-0.7)/0.3;
        R(ex+2,ey+1,w-4,Math.max(1,Math.round((h-3)*ls)),'#fffdf5');
      }
    }
  }

  function showD(txt,last){
    document.getElementById('bdD').style.display='block';
    document.getElementById('bdT').textContent=txt;
    document.getElementById('bdK').textContent=last?'[ THE END — click to restart ]':'▼ tap to continue';
  }
  function hideD(){document.getElementById('bdD').style.display='none'}

  function draw(){
    ctx.clearRect(0,0,C.width,C.height);
    bg();
    if(state==='TITLE'){
      char(80,GY,Math.floor(fr/8),'walk');
      ctx.fillStyle='#ffd700'; ctx.font=`bold ${SC*7}px monospace`; ctx.textBaseline='top';
      ctx.fillText('BIRTHDAY',20*SC,14*SC);
      ctx.fillStyle='#e8d5ff'; ctx.font=`bold ${SC*5}px monospace`;
      ctx.fillText('QUEST',52*SC,29*SC);
      if(Math.floor(fr/18)%2===0){
        ctx.fillStyle='#9c6cbf'; ctx.font=`${SC*3}px monospace`;
        ctx.fillText('[ PRESS START ]',30*SC,48*SC);
      }
      ctx.fillStyle='rgba(255,255,200,0.3)'; ctx.font=`${SC*2}px monospace`;
      ctx.fillText('pixel story edition',38*SC,58*SC);

    } else if(state==='WALK'){
      env(EX,EY,14,10,0); char(cx,GY,Math.floor(fr/6),'walk');

    } else if(state==='REACH'){
      env(EX,EY,14,10,0); char(cx,GY,0,'reach');

    } else if(state==='HOLD'){
      char(cx,GY,0,'hold'); env(cx+2,GY-30,14,10,0);

    } else if(state==='OPENING'){
      const e=ot<0.5?2*ot*ot:-1+(4-2*ot)*ot;
      const ex2=(cx+2)*(1-e), ey2=(GY-30)*(1-e), ew=14+e*(LW-14), eh=10+e*(LH-10);
      if(ot<0.3) char(cx,GY,0,'hold');
      env(ex2,ey2,ew,eh,e);

    } else if(state==='LETTER'){
      R(0,0,LW,LH,'#fffdf5');
      R(3,3,LW-6,2,'#d4a84b'); R(3,LH-5,LW-6,2,'#d4a84b');
      R(3,3,2,LH-6,'#d4a84b'); R(LW-5,3,2,LH-6,'#d4a84b');
      for(let ly=14;ly<LH-10;ly+=8) R(8,ly,LW-16,1,'#e8e0cc');
      R(4,4,2,2,'#ffd700'); R(LW-6,4,2,2,'#ffd700');
      R(4,LH-6,2,2,'#ffd700'); R(LW-6,LH-6,2,2,'#ffd700');
      // Pixel heart top center
      [[78,6],[79,6],[81,6],[82,6],[77,7],[83,7],[77,8],[83,8],[78,9],[82,9],[79,10],[81,10],[80,11]].forEach(([hx,hy])=>R(hx,hy,1,1,'#e05080'));

    } else if(state==='CELEBRATE'){
      const cols=['#ff6b6b','#ffd700','#7c3aed','#00d2ff','#ff9d00','#ff69b4'];
      for(let i=0;i<40;i++){
        const px2=(Math.sin(fr*0.1+i*1.2)*0.5+0.5)*LW;
        const py2=(fr*0.5+i*7)%LH;
        R(px2,py2,2,2,cols[i%cols.length]);
      }
      char(80,GY,Math.floor(fr/4),'walk');
      ctx.fillStyle='#ffd700'; ctx.font=`bold ${SC*5}px monospace`; ctx.textBaseline='top';
      ctx.fillText('HAPPY',40*SC,10*SC);
      ctx.fillStyle='#ff9d00'; ctx.font=`bold ${SC*5}px monospace`;
      ctx.fillText('BIRTHDAY!',26*SC,24*SC);
      for(let i=0;i<8;i++){
        const sx=(fr*2+i*22)%(LW+10);
        R(sx,8+i*7,3,1,'#fff'); if(sx>3) R(sx-3,8+i*7,2,1,'rgba(255,255,255,0.3)');
      }
    }
  }

  function update(){
    if(state==='WALK'){cx+=0.6; if(cx>=EX-14){state='REACH';fr=0}}
    if(state==='REACH'&&fr>45){state='HOLD';fr=0;showD(DLGS[0],false)}
    if(state==='OPENING'){ot=Math.min(1,ot+0.018); if(ot>=1){state='LETTER';di=1;showD(DLGS[1],false)}}
    if(state==='CELEBRATE'&&fr===1) showD(DLGS[3],true);
  }

  function loop(){fr++;update();draw();requestAnimationFrame(loop)}

  function bdAdv(){
    di++;
    if(state==='HOLD'){hideD();state='OPENING';ot=0;}
    else if(state==='LETTER'){
      if(di<DLGS.length-1) showD(DLGS[di],false);
      else{hideD();state='CELEBRATE';fr=0;}
    } else if(state==='CELEBRATE'){
      hideD();state='TITLE';cx=12;di=0;ot=0;fr=0;
      document.getElementById('bdS').style.display='';
    }
  }

  window.bdGo=function(){document.getElementById('bdS').style.display='none';state='WALK';cx=12;fr=0;};
  window.bdAdv=bdAdv;
  C.onclick=()=>{if(['HOLD','LETTER','CELEBRATE'].includes(state))bdAdv();};
  loop();
})();
</script>
